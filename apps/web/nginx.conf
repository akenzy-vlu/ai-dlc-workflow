# The SPA and the API are served from one origin, so the browser never negotiates CORS
# and the socket shares the page's host. This mirrors the dev-server proxy in
# apps/web/vite.config.ts — the two have to stay in step, or a behaviour that works under
# `pnpm dev` breaks only once it is built.

upstream aidlc_api {
    server api:7777;
}

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # socket.io. The client connects with transports: ['websocket'] and no polling
    # fallback (see apps/web/src/data/datasource/socket/socket-client.ts), so a missing
    # Upgrade header here is not a slow path — it is a socket that never connects and a
    # console that silently stops live-updating.
    location /events {
        proxy_pass         http://aidlc_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
        proxy_buffering    off;
    }

    location /api/ {
        proxy_pass         http://aidlc_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # A gate sweep or an agent run is a subprocess, not a database query. nginx's 60s
        # default would cut a long controller run off mid-flight and report a 504 for work
        # that actually succeeded.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # Agent logs stream line by line; buffering them defeats the point.
        proxy_buffering    off;
    }

    # Vite emits content-hashed filenames, so these are safe to pin forever.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # The entry point must never be cached, or a deploy leaves clients on a stale bundle
    # pointing at asset hashes that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

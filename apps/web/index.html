<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/kiln-app-icon.svg" />
    <meta name="theme-color" content="#131211" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F7F5F0" media="(prefers-color-scheme: light)" />
    <title>kiln — AI-DLC console</title>
    <script>
      // Resolve the theme before first paint. Doing this in React means a white flash on
      // every load for anyone using dark mode, which is the one thing a dark theme must
      // not do.
      (() => {
        try {
          const stored = localStorage.getItem('kiln.theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const resolved = stored === 'dark' || stored === 'light' ? stored : prefersDark ? 'dark' : 'light';
          document.documentElement.dataset.theme = resolved;
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
